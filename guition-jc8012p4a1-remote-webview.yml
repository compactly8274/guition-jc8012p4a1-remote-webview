# ==============================================================================
# ESPHome - Guition JC8012P4A1 (ESP32-P4 + ESP32-C6) with Remote WebView
# ==============================================================================
#
# HARDWARE:
#   Main MCU : ESP32-P4NRW32 (dual-core RISC-V, 400 MHz, 32 MB PSRAM, 16 MB Flash)
#   WiFi/BT  : ESP32-C6-MINI-1U-N4 (coprocessor via SDIO / esp32_hosted)
#   Display  : 10.1" MIPI DSI, 800x1280, IPS
#   Touch    : GSL3680 capacitive (I2C)
#   Backlight: GPIO23 via LEDC
# ==============================================================================
#
# BEFORE DEPLOYING:
#   1. Edit the api.encryption.key below — it MUST be a 32-byte base64 string.
#      Generate one with PowerShell:
#        [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }) -as [byte[]])
#      Then paste it where "REPLACE_WITH_YOUR_API_ENCRYPTION_KEY" appears below.
#      The same key must be configured in Home Assistant for the device to
#      connect — HA will offer to set it up the first time the device
#      advertises itself.
#
#   2. Edit rwv_server_host (the "your-ha-server-ip" placeholder below) and
#      device_use_address (in the wifi block) to match your network. The
#      default is a placeholder so the YAML will not connect out of the box
#      — that's intentional. Don't deploy a public repo with your real IPs.
#
# ==============================================================================

substitutions:
  device_name: "p4-webview"
  friendly_name: "P4 WebView Panel"
  # The IP/hostname of the machine running the RemoteWebView server.
  # Replace "your-ha-server-ip" with your actual HA server address.
  rwv_server_host: "your-ha-server-ip"
  rwv_server_port: "8081"
  rwv_device_id: "p4-panel-1"

# ==============================================================================
# Core ESPHome config
# ==============================================================================
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Guition JC8012P4A1 — ESP32-P4 + ESP32-C6 — Remote WebView"
  min_version: "2026.4.0"
  on_boot:
    priority: 600   # Run early, before touchscreen initializes
    then:
      # Hard reset the GSL3680 touch controller before it initializes.
      # Without this the controller sometimes starts with stale calibration
      # state from the previous session, causing phantom/ghost touches.
      - switch.turn_off: display_power
      - delay: 500ms
      - switch.turn_on: display_power
      - delay: 500ms
      - logger.log: "Display power cycled — GSL3680 reset complete"

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  # 400MHz is the documented max for the ESP32-P4; 360MHz is a conservative
  # setting that some early silicon required for stability.
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_CODEC_I2C_BACKWARD_COMPATIBLE: "n"
      # Increased stack size prevents overflow during heavy init
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"
    components:
      - name: "bitbank2/jpegdec"
        source: https://github.com/strange-v/jpegdec-esphome
      - name: "espressif/esp_websocket_client"
        ref: 1.5.0

psram:
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

# ==============================================================================
# External components
# ==============================================================================
external_components:
  # GSL3680 capacitive touchscreen driver
  # Uses kvj's fork which integrates with ESPHome's i2c: component properly.
  # The willumpie82 fork bypasses ESPHome's I2C abstraction and calls
  # esp_lcd_new_panel_io_i2c(I2C_NUM_0) directly, which conflicts with
  # ESPHome's own i2c_master bus initialization on the same port, causing
  # a panic: "CONFLICT! driver_ng is not allowed to be used with this old
  # driver". If touch doesn't register with this driver, the issue is
  # likely the firmware data (gsl_config_data_id) not matching the panel
  # revision, not the driver framework itself.
  - source: github://kvj/esphome@jd9365_gsl3680
    refresh: 1d
    components: [gsl3680]

  # RemoteWebView client component
  - source: github://strange-v/RemoteWebViewClient@main
    refresh: 1d
    components: [remote_webview]

  # NOTE: mipi_dsi is built into ESPHome >= 2025.8.0 with native JC8012P4A1
  # support. The willumpie82 fork is no longer needed.

# ==============================================================================
# WiFi / connectivity (via ESP32-C6 coprocessor + esp32_hosted)
# ==============================================================================
esp32_hosted:
  variant: ESP32C6
  reset_pin: 54     # GPIO54 resets the C6 coprocessor
  cmd_pin: 19
  clk_pin: 18
  d0_pin: 14
  d1_pin: 15
  d2_pin: 16
  d3_pin: 17
  active_high: true
  # Conservative SDIO frequency prevents RX queue overflow during association
  sdio_frequency: 4000000

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Static IP for this device. Replace with the IP you want the device at
  # on your network. The mDNS hostname (p4-webview.local) will also work
  # for the initial flash via USB; OTA can use this IP afterwards.
  use_address: "your-device-ip"
  output_power: "8.5db"
  # REQUIRED on P4+C6: power saving causes SDIO packet loss during association
  power_save_mode: NONE
  # Skip AP scan - connect directly to known SSID
  fast_connect: true
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

captive_portal:

# ==============================================================================
# Home Assistant / OTA / Logging
# ==============================================================================
api:
  # Disable the 15-min auto-reboot when no API client is connected.
  # The daily 3 AM restart (below) and the manual restart button are
  # still in effect. Without this, if HA is temporarily down (HA
  # restart, network blip) or the API encryption key on the HA side
  # doesn't match the device, the device goes into a reboot loop
  # because ESPHome's default is to force a reboot after 15 minutes
  # of no API client. 0s disables the auto-reboot entirely.
  reboot_timeout: 0s
  encryption:
    # IMPORTANT: Replace this placeholder with a real 32-byte base64 string
    # before flashing. See the top of this file for the PowerShell command
    # to generate one. The same key must be configured in Home Assistant.
    key: "REPLACE_WITH_YOUR_API_ENCRYPTION_KEY"

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  hardware_uart: UART0
  baud_rate: 115200
  level: DEBUG
  logs:
    lvgl: WARN
    display: DEBUG
    remote_webview: DEBUG
    mipi_dsi: DEBUG

preferences:
  flash_write_interval: 5min

# ==============================================================================
# Display — MIPI DSI, 800x1280 portrait (JC8012P4A1)
# NOTE: Do NOT set rotation here with ESPHome 2026.4+.
# remote_webview handles orientation via its own rotation setting below.
# ==============================================================================
display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: my_display
    update_interval: never
    reset_pin: GPIO27
    auto_clear_enabled: false

# ==============================================================================
# Backlight
# ==============================================================================
output:
  - platform: ledc
    pin: GPIO23
    id: backlight_output
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: backlight_output
    name: "Panel Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON

# ==============================================================================
# I2C (touchscreen)
# ==============================================================================
i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: false
    frequency: 400kHz

# ==============================================================================
# Touchscreen — GSL3680
#
# FIX: Ghost touches after restart are caused by a transform mismatch with
# remote_webview's rotation: 90 (landscape). The display panel is physically
# portrait (800x1280). remote_webview rotates the rendered content 90° so it
# fills the screen in landscape. The touch controller reports raw portrait
# coordinates which must be transformed to match.
#
# For rotation: 90 (landscape, USB on left side):
#   swap_xy: true   — swaps X and Y axes to match the rotated orientation
#   mirror_x: true  — mirrors X to correct left/right after swap
#   mirror_y: false — no Y mirror needed for 90° CCW rotation
#
# If touches are still off after flashing, try toggling mirror_x or mirror_y
# one at a time — the exact values can vary by panel revision.
# ==============================================================================
touchscreen:
  - platform: gsl3680
    id: my_touchscreen
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    # touch_timeout: forces a minimum hold time before a release is detected.
    # Helps filter spurious release/re-press flicker from noisy GSL3680 readings.
    touch_timeout: 50ms
    transform:
      mirror_y: false
      mirror_x: true
      swap_xy: false
    on_touch:
      - light.turn_on: backlight
      - lambda: |-
          // ---- GSL3680 noise filter ----
          // The GSL3680 is known for noisy readings on this panel. Three filters:
          // 1. Time debounce: drop touches within 80ms of the last accepted touch
          // 2. Coordinate jump filter: drop touches that move >500px in a single
          //    frame (impossible for a human finger, indicates noise)
          // 3. Edge rejection: drop touches at coordinate 0,0 or max edge that
          //    appear without any prior movement (classic ghost touch signature)
          static uint32_t last_touch_ms = 0;
          static int16_t last_x = -1, last_y = -1;
          uint32_t now = millis();

          // Filter 1: time debounce
          if (now - last_touch_ms < 80) return;
          last_touch_ms = now;

          // Filter 2: coordinate jump filter
          if (last_x >= 0 && last_y >= 0) {
            int dx = abs(touch.x - last_x);
            int dy = abs(touch.y - last_y);
            if (dx > 500 || dy > 500) {
              ESP_LOGW("touch_filter", "Dropped jump: dx=%d dy=%d", dx, dy);
              return;
            }
          }

          // Filter 3: edge ghost rejection
          // Touches at exactly (0,0) are a classic GSL3680 ghost signature
          // from electrode noise. Also drop touches where the raw coordinate
          // is at the extreme edge (0 or 0xFFF) — these are noise spikes.
          if ((touch.x == 0 && touch.y == 0) ||
              (touch.x_raw == 0 && touch.y_raw == 0) ||
              (touch.x_raw >= 0x0FFF && touch.y_raw == 0)) {
            ESP_LOGW("touch_filter", "Dropped edge ghost: x=%d y=%d raw=%d,%d", touch.x, touch.y, touch.x_raw, touch.y_raw);
            return;
          }

          last_x = touch.x;
          last_y = touch.y;
          ESP_LOGI("touch", "x=%d y=%d x_raw=%d y_raw=%d", touch.x, touch.y, touch.x_raw, touch.y_raw);

# ==============================================================================
# Remote WebView
# ==============================================================================
remote_webview:
  display_id: my_display
  touchscreen_id: my_touchscreen
  server: "${rwv_server_host}:${rwv_server_port}"
  url: "http://homeassistant.local:8123"
  device_id: ${rwv_device_id}
  tile_size: 64
  rotation: 90
  full_frame_tile_count: 1
  full_frame_area_threshold: 0.2
  full_frame_every: 20
  every_nth_frame: 1
  min_frame_interval: 50
  jpeg_quality: 60
  max_bytes_per_msg: 524288
  big_endian: false


# ==============================================================================
# Utility buttons / sensors
# ==============================================================================
button:
  - platform: restart
    name: "Restart Panel"
    id: restart_button
  - platform: factory_reset
    name: "Factory Reset"
  - platform: template
    name: "Restart Display Power"
    icon: mdi:monitor-shimmer
    on_press:
      - switch.turn_off: display_power
      - delay: 5s
      - switch.turn_on: display_power

switch:
  # Controls panel power for LCD and GSL3680 touch controller.
  # Marked internal — managed via the "Restart Display Power" button below.
  # Cycling this pin hard-resets the GSL3680, clearing ghost touch states.
  - platform: gpio
    pin: GPIO29
    id: display_power
    name: "Display Power"
    internal: true
    restore_mode: ALWAYS_ON

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    mac_address:
      name: "WiFi MAC"
      entity_category: diagnostic

image:
  defaults:
    byte_order: little_endian

# Daily 3 AM auto-restart — clears any state drift accumulated over the day
# (ghost touches, websocket stalemates, RAM creep). The id matches the
# restart button above.
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - button.press: restart_button

# Periodic GSL3680 touch controller reset. The controller occasionally
# gets into a bad state where a single X-axis electrode reports as
# constantly touched, causing ghost touches. A 5-second power cycle
# of the display clears it. Empirically, ghosts start appearing after
# ~1 hour of continuous operation, so this cycles every 90 minutes
# as a preventive measure. Adjust the interval if ghosts return
# at a different cadence, or remove this block if the noise filters
# in the on_touch lambda above catch them adequately.
interval:
  - id: touch_reset_interval
    interval: 90min
    then:
      - switch.turn_off: display_power
      - delay: 5s
      - switch.turn_on: display_power
