# ==============================================================================
# ESPHome - Guition JC8012P4A1 (ESP32-P4 + ESP32-C6) - Native LVGL Dashboard
# ==============================================================================
#
# HARDWARE:
#   Main MCU : ESP32-P4NRW32 (dual-core RISC-V, 360 MHz, 32 MB PSRAM, 16 MB Flash)
#   WiFi/BT  : ESP32-C6-MINI-1U-N4 (coprocessor via SDIO / esp32_hosted)
#   Display  : 10.1" MIPI DSI, 800x1280 physical → 1280x800 landscape via LVGL rotation
#   Touch    : GSL3680 capacitive (I2C)
#   Backlight: GPIO23 via LEDC
#
# LAYOUT — mirrors the "ESP-P4" HA view, single screen, no tabs:
#   Col 1 (left,  ~420px) : PirateWeather current + 7-day forecast, Sun, Moon
#   Col 2 (mid,   ~420px) : Indoor temp/humidity/pressure tiles + history charts
#   Col 3 (right, ~420px) : Office light, PM2.5, AC thermostat, Dehumidifier
#
# CHARTS: built from sensor data pushed every 2 min since last boot.
#         Charts start empty and fill over time (no HA history access in LVGL).
#
# TEMPERATURE UNITS: Celsius throughout (matching the HA dashboard).
# ==============================================================================

substitutions:
  device_name: "p4-lvgl"
  friendly_name: "P4 LVGL Panel"

# ==============================================================================
# Core ESPHome config
# ==============================================================================
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Guition JC8012P4A1 — ESP32-P4 + ESP32-C6 — Native LVGL"
  min_version: "2026.4.0"
  on_boot:
    priority: 600
    then:
      - switch.turn_off: display_power
      - delay: 1000ms
      - switch.turn_on: display_power
      - delay: 1000ms
      - logger.log: "Display power cycled — GSL3680 reset complete"

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_CODEC_I2C_BACKWARD_COMPATIBLE: "n"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"

psram:
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

external_components:
  - source: github://kvj/esphome@jd9365_gsl3680
    refresh: 1d
    components: [gsl3680]

# ==============================================================================
# WiFi / connectivity
# ==============================================================================
esp32_hosted:
  variant: ESP32C6
  reset_pin: 54
  cmd_pin: 19
  clk_pin: 18
  d0_pin: 14
  d1_pin: 15
  d2_pin: 16
  d3_pin: 17
  active_high: true
  sdio_frequency: 4000000

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: "8.5db"
  power_save_mode: NONE
  fast_connect: true
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

captive_portal:

# ==============================================================================
# HA / OTA / Logging
# ==============================================================================
api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  hardware_uart: UART0
  baud_rate: 115200
  level: INFO
  logs:
    lvgl: WARN

preferences:
  flash_write_interval: 5min

# ==============================================================================
# Time
# ==============================================================================
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lvgl.label.update:
              id: lbl_clock
              text: !lambda |-
                auto t = id(ha_time).now();
                static char buf[6];
                snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
                return buf;
          - lvgl.label.update:
              id: lbl_date
              text: !lambda |-
                auto t = id(ha_time).now();
                static char buf[20];
                static const char* d[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
                static const char* m[] = {"Jan","Feb","Mar","Apr","May","Jun",
                                          "Jul","Aug","Sep","Oct","Nov","Dec"};
                snprintf(buf, sizeof(buf), "%s %s %d", d[t.day_of_week], m[t.month-1], t.day_of_month);
                return buf;

# ==============================================================================
# Display
# ==============================================================================
display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: my_display
    update_interval: never
    reset_pin: GPIO27
    auto_clear_enabled: true

output:
  - platform: ledc
    pin: GPIO23
    id: backlight_output
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: backlight_output
    name: "Panel Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON

# ==============================================================================
# I2C + Touchscreen
# ==============================================================================
i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: false
    frequency: 100kHz

touchscreen:
  - platform: gsl3680
    id: my_touchscreen
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
    on_touch:
      - light.turn_on: backlight

# ==============================================================================
# Home Assistant entity subscriptions
# ==============================================================================
sensor:
  # Outdoor weather
  - platform: homeassistant
    id: weather_temp_out
    entity_id: weather.pirateweather
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: lbl_weather_temp
          text: !lambda |-
            static char buf[12];
            snprintf(buf, sizeof(buf), "%.1f °C", x);
            return buf;

  - platform: homeassistant
    id: weather_pressure_out
    entity_id: weather.pirateweather
    attribute: pressure
    on_value:
      - lvgl.label.update:
          id: lbl_weather_pressure
          text: !lambda |-
            static char buf[16];
            snprintf(buf, sizeof(buf), "%.2f hPa", x);
            return buf;

  # Indoor sensors (Aqara)
  - platform: homeassistant
    id: indoor_temp
    entity_id: sensor.lumi_lumi_weather_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_indoor_temp
          text: !lambda |-
            static char buf[12];
            snprintf(buf, sizeof(buf), "%.1f °C", x);
            return buf;
      - lvgl.label.update:
          id: lbl_temp_big
          text: !lambda |-
            static char buf[12];
            snprintf(buf, sizeof(buf), "%.1f °C", x);
            return buf;
      - lvgl.label.update:
          id: lbl_temp_range
          text: !lambda |-
            static float mn = NAN, mx = NAN;
            if (isnan(mn) || x < mn) mn = x;
            if (isnan(mx) || x > mx) mx = x;
            static char buf[28];
            snprintf(buf, sizeof(buf), "%.1f \xe2\x80\x93 %.1f \xc2\xb0C", mn, mx);
            return buf;

  - platform: homeassistant
    id: indoor_humidity
    entity_id: sensor.lumi_lumi_weather_humidity
    on_value:
      - lvgl.label.update:
          id: lbl_indoor_humidity
          text: !lambda |-
            static char buf[10];
            snprintf(buf, sizeof(buf), "%.1f%%", x);
            return buf;
      - lvgl.label.update:
          id: lbl_humidity_big
          text: !lambda |-
            static char buf[10];
            snprintf(buf, sizeof(buf), "%.1f%%", x);
            return buf;
      - lvgl.label.update:
          id: lbl_humidity_range
          text: !lambda |-
            static float mn = NAN, mx = NAN;
            if (isnan(mn) || x < mn) mn = x;
            if (isnan(mx) || x > mx) mx = x;
            static char buf[20];
            snprintf(buf, sizeof(buf), "%.1f%% \xe2\x80\x93 %.1f%%", mn, mx);
            return buf;

  - platform: homeassistant
    id: indoor_pressure
    entity_id: sensor.lumi_lumi_weather_pressure
    on_value:
      - lvgl.label.update:
          id: lbl_indoor_pressure
          text: !lambda |-
            static char buf[14];
            snprintf(buf, sizeof(buf), "%.0f hPa", x);
            return buf;
      - lvgl.label.update:
          id: lbl_pressure_big
          text: !lambda |-
            static char buf[14];
            snprintf(buf, sizeof(buf), "%.0f hPa", x);
            return buf;
      - lvgl.label.update:
          id: lbl_pressure_range
          text: !lambda |-
            static float mn = NAN, mx = NAN;
            if (isnan(mn) || x < mn) mn = x;
            if (isnan(mx) || x > mx) mx = x;
            static char buf[24];
            snprintf(buf, sizeof(buf), "%.0f \xe2\x80\x93 %.0f hPa", mn, mx);
            return buf;

  # Zone thermostat (Air Conditioner)
  - platform: homeassistant
    id: thermo2_current
    entity_id: climate.30786325755351_climate
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_t2_current
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%.0f°", x);
            return buf;

  - platform: homeassistant
    id: thermo2_target
    entity_id: climate.30786325755351_climate
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: lbl_t2_target
          text: !lambda |-
            static char buf[10];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return buf;

  # Dehumidifier target humidity
  - platform: homeassistant
    id: humidifier_target
    entity_id: humidifier.147334558381061_humidifier
    attribute: humidity
    on_value:
      - lvgl.label.update:
          id: lbl_dehum_target
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            return buf;

  # Air quality
  - platform: homeassistant
    id: pm25
    entity_id: sensor.cyclo_uv_310_pm2_5
    on_value:
      - lvgl.label.update:
          id: lbl_pm25_val
          text: !lambda |-
            static char buf[16];
            snprintf(buf, sizeof(buf), "%.0f μg/m³", x);
            return buf;

  # Diagnostics
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  # Weather condition
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.pirateweather
    on_value:
      - lvgl.label.update:
          id: lbl_weather_condition
          text: !lambda |-
            if (x == "sunny")           return "Sunny";
            if (x == "clear-night")     return "Clear Night";
            if (x == "partlycloudy")    return "Partly cloudy";
            if (x == "cloudy")          return "Cloudy";
            if (x == "fog")             return "Foggy";
            if (x == "windy")           return "Windy";
            if (x == "windy-variant")   return "Windy";
            if (x == "rainy")           return "Rainy";
            if (x == "pouring")         return "Heavy Rain";
            if (x == "snowy")           return "Snowy";
            if (x == "snowy-rainy")     return "Sleet";
            if (x == "hail")            return "Hail";
            if (x == "lightning")       return "Lightning";
            if (x == "lightning-rainy") return "Thunderstorm";
            if (x == "exceptional")     return "Exceptional";
            return x.c_str();

  # 7-day forecast (requires ha-pirateweather-forecast-template.yaml in HA)
  - platform: homeassistant
    id: forecast_summary
    entity_id: sensor.pirateweather_forecast_summary
    on_value:
      - lvgl.label.update:
          id: lbl_forecast
          text: !lambda 'return x.c_str();'

  # Moon phase
  - platform: homeassistant
    id: moon_phase
    entity_id: sensor.moon_phase
    on_value:
      - lvgl.label.update:
          id: lbl_moon
          text: !lambda 'return x.c_str();'

  # Sun
  - platform: homeassistant
    id: sun_next_rising
    entity_id: sun.sun
    attribute: next_rising
    on_value:
      - lvgl.label.update:
          id: lbl_sunrise
          text: !lambda 'return x.c_str();'

  - platform: homeassistant
    id: sun_next_setting
    entity_id: sun.sun
    attribute: next_setting
    on_value:
      - lvgl.label.update:
          id: lbl_sunset
          text: !lambda 'return x.c_str();'

  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun
    on_value:
      - lvgl.label.update:
          id: lbl_sun_state
          text: !lambda |-
            if (x == "above_horizon") return "Above horizon";
            if (x == "below_horizon") return "Below horizon";
            return x.c_str();

  # Zone thermostat HVAC action
  - platform: homeassistant
    id: thermo2_action
    entity_id: climate.30786325755351_climate
    attribute: hvac_action
    on_value:
      - lvgl.label.update:
          id: lbl_t2_action
          text: !lambda |-
            if (x == "heating") return "Heating";
            if (x == "cooling") return "Cooling";
            if (x == "fan_only") return "Fan only";
            if (x == "idle")    return "Idle";
            if (x == "off")     return "Off";
            return x.c_str();

  # Office light state
  - platform: homeassistant
    id: office_light_state
    entity_id: light.wiz_rgbw_tunable_f3a14a
    on_value:
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lvgl.label.update:
                id: lbl_light_status
                text: "ON"
            - lambda: |
                lv_obj_set_style_bg_color(id(btn_office_light), lv_color_hex(0xff9100), LV_PART_MAIN);
                lv_obj_invalidate(id(btn_office_light));
          else:
            - lvgl.label.update:
                id: lbl_light_status
                text: "OFF"
            - lambda: |
                lv_obj_set_style_bg_color(id(btn_office_light), lv_color_hex(0x2a2a2a), LV_PART_MAIN);
                lv_obj_invalidate(id(btn_office_light));

  # Humidifier state
  - platform: homeassistant
    id: humidifier_state
    entity_id: humidifier.147334558381061_humidifier
    on_value:
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lvgl.label.update:
                id: lbl_humidifier_status
                text: "ON"
            - lambda: |
                lv_obj_set_style_bg_color(id(btn_humidifier), lv_color_hex(0x2979ff), LV_PART_MAIN);
                lv_obj_invalidate(id(btn_humidifier));
          else:
            - lvgl.label.update:
                id: lbl_humidifier_status
                text: "OFF"
            - lambda: |
                lv_obj_set_style_bg_color(id(btn_humidifier), lv_color_hex(0x2a2a2a), LV_PART_MAIN);
                lv_obj_invalidate(id(btn_humidifier));

  # WiFi diagnostics
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    mac_address:
      name: "WiFi MAC"
      entity_category: diagnostic

# ==============================================================================
# Intervals
# ==============================================================================
interval:
  # GSL3680 periodic reset — prevents touch drift during long uptime
  - interval: 6h
    then:
      - switch.turn_off: display_power
      - delay: 1000ms
      - switch.turn_on: display_power


# ==============================================================================
# Buttons / switches
# ==============================================================================
button:
  - platform: restart
    name: "Restart Panel"
  - platform: factory_reset
    name: "Factory Reset"
  - platform: template
    name: "Restart Display Power"
    icon: mdi:monitor-shimmer
    on_press:
      - switch.turn_off: display_power
      - delay: 5s
      - switch.turn_on: display_power

switch:
  - platform: gpio
    pin: GPIO29
    id: display_power
    name: "Display Power"
    internal: true
    restore_mode: ALWAYS_ON

image:
  defaults:
    byte_order: little_endian

# ==============================================================================
# LVGL Dashboard — single screen, 3-column layout
#
# Physical: 800x1280 portrait.  LVGL rotation: 90 → logical 1280x800.
#
# Zones (logical landscape):
#   y   0– 39 : status bar (top_layer) — clock right, date left
#   y  40–799 : content (3 columns, 760px tall)
#
# Column layout (content area 1280x760, 8px outer margin, 8px gaps):
#   Col 1  x=  8  w=412  Weather / Sun / Moon
#   Col 2  x=428  w=422  Indoor env tiles + pressure/temp/humidity charts
#   Col 3  x=858  w=414  Office light, PM2.5, AC thermostat, Dehumidifier
# ==============================================================================
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  log_level: WARN
  rotation: 90
  # Global screen background — must be set here to override LVGL's default purple theme
  bg_color: 0x111111
  bg_opa: 1

  style_definitions:
    # Dark card — rounded panel with subtle border
    - id: style_card
      bg_color: 0x1e1e1e
      bg_opa: 1
      border_color: 0x2d2d2d
      border_width: 1
      radius: 12
      pad_all: 12
    # Small sensor tile
    - id: style_tile
      bg_color: 0x252525
      bg_opa: 1
      border_color: 0x2d2d2d
      border_width: 1
      radius: 8
      pad_all: 10
    # Standard dark button
    - id: style_btn
      bg_color: 0x2a2a2a
      bg_opa: 1
      border_color: 0x404040
      border_width: 1
      radius: 10
      text_color: 0xffffff
    # Round ±1 button
    - id: style_btn_round
      bg_color: 0x2a2a2a
      bg_opa: 1
      border_color: 0x404040
      border_width: 1
      radius: 28
      text_color: 0xffffff

  top_layer:
    widgets:
      # Status bar — full width, 40px
      - obj:
          x: 0
          y: 0
          width: 1280
          height: 40
          bg_color: 0x0a0a0a
          bg_opa: 1
          border_width: 0
          radius: 0
          pad_left: 16
          pad_right: 16
          pad_top: 0
          pad_bottom: 0
          widgets:
            - label:
                id: lbl_date
                text: "---"
                text_color: 0x888888
                text_font: montserrat_18
                align: left_mid
            - label:
                id: lbl_clock
                text: "00:00"
                text_color: 0xffffff
                text_font: montserrat_24
                align: right_mid

  pages:
    - id: page_main
      bg_color: 0x111111
      bg_opa: 1
      widgets:

        # ==============================================================
        # COLUMN 1 — Weather / Sun / Moon  (x=8, w=412, y=48)
        # Cards: Weather h=408, Sun h=185, Moon h=58
        # Total: 408+8+185+8+58 = 667, slack at bottom: 760-48-667=45px
        # ==============================================================
        - obj:
            x: 8
            y: 48
            width: 412
            height: 712
            bg_opa: 0
            border_width: 0
            pad_all: 0

            widgets:
              # ---- WEATHER CARD ----
              - obj:
                  x: 0
                  y: 0
                  width: 412
                  height: 408
                  bg_color: 0x1e1e1e
                  bg_opa: 1
                  border_color: 0x2d2d2d
                  border_width: 1
                  radius: 12
                  pad_all: 14

                  widgets:
                    # Condition (large, top-left)
                    - label:
                        id: lbl_weather_condition
                        x: 0
                        y: 0
                        width: 240
                        text: "Loading..."
                        text_color: 0xffffff
                        text_font: montserrat_24
                    # Source tag
                    - label:
                        x: 0
                        y: 30
                        text: "PirateWeather"
                        text_color: 0x888888
                        text_font: montserrat_14
                    # Temperature (right-aligned, same row as condition)
                    - label:
                        id: lbl_weather_temp
                        x: 234
                        y: 0
                        width: 150
                        text: "--.- °C"
                        text_color: 0xffffff
                        text_font: montserrat_24
                        text_align: right
                    # Pressure row
                    - label:
                        x: 0
                        y: 56
                        text: "Pressure:"
                        text_color: 0x888888
                        text_font: montserrat_16
                    - label:
                        id: lbl_weather_pressure
                        x: 90
                        y: 56
                        width: 294
                        text: "--.-- hPa"
                        text_color: 0x64b5f6
                        text_font: montserrat_16
                    # Divider
                    - obj:
                        x: 0
                        y: 82
                        width: 384
                        height: 1
                        bg_color: 0x333333
                        bg_opa: 1
                        border_width: 0
                    # Forecast header
                    - label:
                        x: 0
                        y: 90
                        text: "7-Day Forecast"
                        text_color: 0x666666
                        text_font: montserrat_12
                    # Forecast lines (from sensor.pirateweather_forecast_summary)
                    - label:
                        id: lbl_forecast
                        x: 0
                        y: 108
                        width: 384
                        text: "Loading forecast..."
                        text_color: 0xd0d0d0
                        text_font: montserrat_16
                        long_mode: wrap

              # ---- SUN CARD ----
              - obj:
                  x: 0
                  y: 416
                  width: 412
                  height: 185
                  bg_color: 0x1e1e1e
                  bg_opa: 1
                  border_color: 0x2d2d2d
                  border_width: 1
                  radius: 12
                  pad_all: 14

                  widgets:
                    - label:
                        x: 0
                        y: 0
                        text: "Sun"
                        text_color: 0xffd700
                        text_font: montserrat_18
                    - label:
                        id: lbl_sun_state
                        x: 200
                        y: 2
                        width: 184
                        text: "---"
                        text_color: 0x888888
                        text_font: montserrat_14
                        text_align: right
                    # Divider
                    - obj:
                        x: 0
                        y: 28
                        width: 384
                        height: 1
                        bg_color: 0x333333
                        bg_opa: 1
                        border_width: 0
                    - label:
                        x: 0
                        y: 38
                        text: "Next rising:"
                        text_color: 0x888888
                        text_font: montserrat_14
                    - label:
                        id: lbl_sunrise
                        x: 105
                        y: 38
                        width: 279
                        text: "---"
                        text_color: 0xffd700
                        text_font: montserrat_14
                        text_align: right
                    - label:
                        x: 0
                        y: 62
                        text: "Next setting:"
                        text_color: 0x888888
                        text_font: montserrat_14
                    - label:
                        id: lbl_sunset
                        x: 105
                        y: 62
                        width: 279
                        text: "---"
                        text_color: 0xff8c00
                        text_font: montserrat_14
                        text_align: right
                    # Simple day/night bar
                    - obj:
                        x: 0
                        y: 96
                        width: 384
                        height: 10
                        bg_color: 0x1a3060
                        bg_opa: 1
                        border_width: 0
                        radius: 5
                    - obj:
                        x: 70
                        y: 96
                        width: 244
                        height: 10
                        bg_color: 0xffd700
                        bg_opa: 1
                        border_width: 0
                        radius: 5
                    - label:
                        x: 0
                        y: 114
                        text: "Night"
                        text_color: 0x555555
                        text_font: montserrat_12
                    - label:
                        x: 150
                        y: 114
                        text: "Day"
                        text_color: 0xffd700
                        text_font: montserrat_12
                    - label:
                        x: 320
                        y: 114
                        text: "Night"
                        text_color: 0x555555
                        text_font: montserrat_12
