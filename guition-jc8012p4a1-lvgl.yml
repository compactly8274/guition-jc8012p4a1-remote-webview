# ==============================================================================
# Periodic GSL3680 reset — prevents touch drift during long uptime
# ==============================================================================
interval:
  - interval: 6h
    then:
      - switch.turn_off: display_power
      - delay: 1000ms
      - switch.turn_on: display_power

# ==============================================================================
# Utility buttons / switches
# ==============================================================================
button:
  - platform: restart
    name: "Restart Panel"
  - platform: factory_reset
    name: "Factory Reset"
  - platform: template
    name: "Restart Display Power"
    icon: mdi:monitor-shimmer
    on_press:
      - switch.turn_off: display_power
      - delay: 5s
      - switch.turn_on: display_power

switch:
  - platform: gpio
    pin: GPIO29
    id: display_power
    name: "Display Power"
    internal: true
    restore_mode: ALWAYS_ON
